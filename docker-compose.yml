services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: durak
      POSTGRES_PASSWORD: durak
      POSTGRES_DB: durak
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U durak -d durak']
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3001'
      CORS_ORIGIN: '*'
      DB_ENABLED: 'true'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: durak
      DB_PASSWORD: durak
      DB_NAME: durak
      DB_SYNC: 'true'
    ports:
      - '3001:3001'

volumes:
  postgres-data:
