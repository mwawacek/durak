# Fly.io app definition.
#
# Pick your own `app` name on first deploy with: `fly launch --no-deploy`
# (it will prompt and rewrite this file). The values below are sensible
# defaults for a small "play with friends" deployment.

app = 'durak'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  # Backend port matches our internal_port below.
  PORT = '3010'
  NODE_ENV = 'production'
  # Restrict to your own domain once you have one; '*' is OK while you
  # only use the *.fly.dev host because no cookies are sent.
  CORS_ORIGIN = '*'

[http_service]
  internal_port = 3010
  force_https = true
  # WebSockets stay alive on the same port; Socket.IO upgrades cleanly.
  # Auto-stop the VM when idle (saves ~50% cost on light usage); a fresh
  # request wakes it back up in ~1s (suspend) or ~3s (stop). 'suspend'
  # keeps memory paged out so wake is faster.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '5s'
    interval = '15s'
    method = 'GET'
    timeout = '2s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  # Game state is in-memory but tiny (a few KB per room). 256 MB is plenty.
  memory_mb = 256
  cpu_kind = 'shared'
  cpus = 1
